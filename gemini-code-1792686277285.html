<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModaVibe - Tienda de Ropa</title>
    <!-- Tailwind CSS CDN para un diseño moderno y rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- 1. BARRA DE NAVEGACIÓN (NAVBAR) -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Logo -->
                <div class="flex items-center">
                    <span class="text-2xl font-black tracking-wider text-indigo-600">MODAVIBE</span>
                </div>
                <!-- Enlaces de navegación -->
                <div class="hidden md:flex space-x-8 font-medium">
                    <a href="#" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">Inicio</a>
                    <a href="#productos" class="hover:text-indigo-600 transition">Colección</a>
                    <a href="#productos" class="hover:text-indigo-600 transition">Hombre</a>
                    <a href="#productos" class="hover:text-indigo-600 transition">Mujer</a>
                </div>
                <!-- Botón del Carrito -->
                <div class="flex items-center space-x-4">
                    <button id="cart-btn" class="relative bg-gray-100 p-2.5 rounded-full hover:bg-gray-200 transition">
                        <i class="fas fa-shopping-cart text-gray-700 text-lg"></i>
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-indigo-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 2. SECCIÓN HERO (BANNER PRINCIPAL) -->
    <header class="bg-gradient-to-r from-indigo-900 to-purple-800 text-white py-20 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-4xl sm:text-6xl font-extrabold mb-4 tracking-tight">Renueva Tu Estilo</h1>
            <p class="text-lg sm:text-xl text-indigo-200 mb-8">Descubre la nueva colección de temporada con diseños únicos y la mejor calidad.</p>
            <a href="#productos" class="bg-white text-indigo-900 font-bold px-8 py-3 rounded-full shadow-lg hover:bg-indigo-50 transition transform hover:-translate-y-1 inline-block">Ver Colección</a>
        </div>
    </header>

    <!-- 3. CATÁLOGO DE PRODUCTOS -->
    <main id="productos" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <h2 class="text-3xl font-extrabold text-center mb-12">Nuestros Productos</h2>
        
        <!-- Cuadrícula donde se cargarán los productos mediante JavaScript -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- Los productos se inyectan automáticamente -->
        </div>
    </main>

    <!-- 4. MODAL / CARRITO DE COMPRAS LATERAL -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-6 overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h3 class="text-xl font-bold">Tu Carrito de Compras</h3>
                <button id="close-cart" class="text-gray-500 hover:text-gray-700 text-2xl font-bold">&times;</button>
            </div>
            
            <!-- Lista de items en el carrito -->
            <div id="cart-items" class="flex-grow space-y-4 overflow-y-auto">
                <p class="text-gray-500 text-center py-8">Tu carrito está vacío.</p>
            </div>

            <!-- Total y botón de pago -->
            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>Total:</span>
                    <span id="cart-total">$0.00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition">Proceder al Pago</button>
            </div>
        </div>
    </div>

    <!-- 5. PIE DE PÁGINA (FOOTER) -->
    <footer class="bg-gray-900 text-white py-12 mt-20">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-400">&copy; 2026 ModaVibe. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- 6. LÓGICA EN JAVASCRIPT -->
    <script>
        // Base de datos simulada de ropa
        const products = [
            { id: 1, name: "Camiseta Casual Oversize", price: 29.99, image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500&q=80" },
            { id: 2, name: "Chaqueta de Mezclilla Clásica", price: 79.99, image: "https://images.unsplash.com/photo-1543076447-215ad9ba6923?w=500&q=80" },
            { id: 3, name: "Pantalón Chino Moderno", price: 49.99, image: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=500&q=80" },
            { id: 4, name: "Vestido Floral Elegante", price: 59.99, image: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=500&q=80" },
            { id: 5, name: "Sudadera con Capucha Minimalista", price: 45.00, image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500&q=80" },
            { id: 6, name: "Blazer Sastrero Estilizado", price: 89.99, image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&q=80" },
            { id: 7, name: "Jeans Slim Fit Azul", price: 55.00, image: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=500&q=80" },
            { id: 8, name: "Gorra Deportiva Urbana", price: 19.99, image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=500&q=80" }
        ];

        let cart = [];

        // Referencias a elementos del DOM
        const productGrid = document.getElementById('product-grid');
        const cartBtn = document.getElementById('cart-btn');
        const closeCartBtn = document.getElementById('close-cart');
        const cartModal = document.getElementById('cart-modal');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartCount = document.getElementById('cart-count');
        const cartTotal = document.getElementById('cart-total');

        // Función para renderizar los productos en la pantalla
        function renderProducts() {
            productGrid.innerHTML = products.map(product => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition flex flex-col justify-between">
                    <img src="${product.image}" alt="${product.name}" class="w-full h-64 object-cover">
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-bold text-lg mb-1">${product.name}</h3>
                            <p class="text-indigo-600 font-extrabold text-xl mb-4">$${product.price.toFixed(2)}</p>
                        </div>
                        <button onclick="addToCart(${product.id})" class="w-full bg-gray-900 text-white font-medium py-2 rounded-lg hover:bg-indigo-600 transition">
                            Agregar al Carrito
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Función para agregar un producto al carrito
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCart();
            openCart();
        }

        // Función para actualizar la interfaz del carrito (contador, lista e importe total)
        function updateCart() {
            cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p class="text-gray-500 text-center py-8">Tu carrito está vacío.</p>`;
                cartTotal.textContent = "$0.00";
                return;
            }

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between border-b pb-4">
                    <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded">
                    <div class="flex-grow px-4">
                        <h4 class="font-bold text-sm">${item.name}</h4>
                        <p class="text-gray-600 text-sm">$${item.price.toFixed(2)} x ${item.quantity}</p>
                    </div>
                    <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700 font-bold">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotal.textContent = `$${total.toFixed(2)}`;
        }

        // Función para eliminar un producto del carrito
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        // Funciones para abrir y cerrar el carrito lateral
        function openCart() {
            cartModal.classList.remove('hidden');
        }

        function closeCart() {
            cartModal.classList.add('hidden');
        }

        cartBtn.addEventListener('click', openCart);
        closeCartBtn.addEventListener('click', closeCart);
        cartModal.addEventListener('click', (e) => {
            if (e.target === cartModal) closeCart();
        });

        // Simulación de pasarela de pago
        function checkout() {
            if (cart.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }
            alert("¡Compra realizada con éxito! Gracias por tu pedido en ModaVibe.");
            cart = [];
            updateCart();
            closeCart();
        }

        // Inicializar la aplicación cargando los productos
        renderProducts();
    </script>
</body>
</html>
